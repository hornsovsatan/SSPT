sliders=FSR2_SCALE OFFLINE_MODE GI_SAMPLES GI_BOUNCES DI_QUALITY LIGHT_BLOCK_RADIUS sunPathRotation
screen=FSR2_SCALE OFFLINE_MODE GI_SAMPLES GI_BOUNCES DI_QUALITY LIGHT_BLOCK_RADIUS sunPathRotation
iris.features.required = SSBO CUSTOM_IMAGES
# Current path guide + demodulation factor; packed at GI resolution.
shadow.enabled = true
endFlashShadows = true
dhShadow.enabled = false
shadow.culling = false
# Vanilla cloud geometry is captured without modifying the scene G-buffer.
clouds = fancy
# Four nearest-depth/color channels in quadrants of one image (16 bytes/pixel).
# Precipitation is a separate color layer, never a PT surface or depth writer.
rain.depth = false
blend.gbuffers_weather.colortex14=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex11=off
blend.gbuffers_water.colortex12=off
blend.gbuffers_water.colortex13=off
bufferObject.0 = 16
bufferObject.1 = 67108864
bufferObject.2 = 8388608
# 128^3 block areas/shape flags + primitive-slot owner indices.
bufferObject.3 = 33554432
bufferObject.4 = 67117064
customTexture.traceBlockAtlas = minecraft:textures/atlas/blocks.png
customTexture.traceBlockSpecularAtlas = minecraft:textures/atlas/blocks_s.png
customTexture.vanillaCloudPattern = minecraft:textures/environment/clouds.png


# Geometric normals must belong to the closest surface, including water.
blend.gbuffers_textured_lit.colortex15=off
blend.gbuffers_water.colortex15=off
blend.dh_terrain.colortex15=off
blend.dh_water.colortex15=off


# Ask Iris to submit invisible light-block markers at block centers.
voxelizeLightBlocks=true
bufferObject.5 = 4112

# Explicit mesh emitters (80-byte records) and voxel primitive-to-light map.
bufferObject.6 = 1769488
bufferObject.7 = 16777216
# Three GI-sized planes per reservoir history; frame parity avoids read/write races.
image.giSpatialIntermediate = giSpatialIntermediateSampler rgba rgba32f float false true 1.0 1.0
image.ptSurface = ptSurfaceSampler rgba rgba32f float false true 1.0 1.0
image.cloudLayer = cloudLayerSampler red_integer r32ui unsigned_int true true 2.0 2.0
image.fsrReconstructedDepth = fsrReconstructedDepthSampler red_integer r32ui unsigned_int true true 1.0 1.0
image.fsrDilatedMotion = fsrDilatedMotionSampler rg rg16f half_float false true 1.0 2.0
image.fsrDilatedDepth = fsrDilatedDepthSampler red r32f float false true 1.0 1.0
image.fsrPreparedInput = fsrPreparedInputSampler rgba rgba16f half_float false true 1.0 1.0
image.fsrReactiveMasks = fsrReactiveMasksSampler rg rg16f half_float false true 1.0 1.0
image.fsrNewLocks = fsrNewLocksSampler red r16f half_float false true 1.0 1.0
image.fsrLockInputLuma = fsrLockInputLumaSampler red r16f half_float false true 1.0 1.0
image.fsrColorHistory = fsrColorHistorySampler rgba rgba16f half_float false true 1.0 2.0
image.fsrLockStatus = fsrLockStatusSampler rg rg16f half_float false true 1.0 2.0
image.fsrLumaHistory = fsrLumaHistorySampler rgba rgba16f half_float false true 1.0 2.0
# Paired FSR histories occupy separate vertical halves, preserving all formats.
image.diReservoir0 = diReservoirSampler0 rgba rgba32f float false true 1.0 1.0
image.diReservoir1 = diReservoirSampler1 rgba rgba32f float false true 1.0 1.0
# Seven packed GI-sized planes: raw DI, two temporal pairs, two spatial buffers.
image.diFilter = diFilterSampler rgba rgba32f float false true 1.0 2.0
